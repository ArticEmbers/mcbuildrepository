<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Construction Manifest — Build Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0b121c;
    --bg-panel:#111b28;
    --bg-card:#16212f;
    --bg-card-hover:#1b2839;
    --grid-line: rgba(140,190,210,0.07);
    --hair: rgba(140,190,210,0.14);
    --ink:#e9f1f6;
    --muted:#7d93a6;
    --muted-dim:#556575;
    --cyan:#63c9dd;
    --cyan-dim: rgba(99,201,221,0.14);
    --copper:#d98a4f;
    --copper-dim: rgba(217,138,79,0.16);
    --red:#d0685f;
    --green:#6fbf8b;
    --radius: 14px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  body{
    background:
      radial-gradient(ellipse 80% 60% at 15% -10%, rgba(99,201,221,0.08), transparent 60%),
      radial-gradient(ellipse 70% 50% at 100% 0%, rgba(217,138,79,0.06), transparent 55%),
      repeating-linear-gradient(0deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 32px),
      repeating-linear-gradient(90deg, var(--grid-line) 0px, var(--grid-line) 1px, transparent 1px, transparent 32px),
      var(--bg-deep);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  a{ color:inherit; }
  ::selection{ background:var(--cyan-dim); color:var(--ink); }
  :focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; border-radius:4px; }

  .page{ max-width:1200px; margin:0 auto; padding:36px 24px 80px; }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:24px; flex-wrap:wrap;
    border-bottom:1px solid var(--hair);
    padding-bottom:26px; margin-bottom:34px;
  }
  .brand{ display:flex; gap:14px; align-items:flex-start; }
  .brand-mark{
    width:44px; height:44px; flex:none;
    border:1.5px solid var(--cyan); border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:12px; letter-spacing:0.5px;
    color:var(--cyan); background:var(--cyan-dim); transform:rotate(-4deg);
  }
  .brand h1{ font-family:var(--font-display); font-weight:700; font-size:26px; letter-spacing:0.3px; margin:0 0 4px; }
  .brand .tagline{ margin:0; color:var(--muted); font-size:13.5px; }
  .ledger-stats{ display:flex; gap:0; font-family:var(--font-mono); }
  .ledger-stat{ padding:0 22px; border-left:1px solid var(--hair); text-align:right; }
  .ledger-stat:first-child{ border-left:none; padding-left:0; }
  .ledger-stat .num{ display:block; font-size:22px; font-weight:600; color:var(--ink); line-height:1.1; }
  .ledger-stat .lbl{ display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:1.1px; color:var(--muted-dim); margin-top:5px; }

  /* ---------- Sections ---------- */
  .section-label{
    font-family:var(--font-mono); font-size:11.5px; text-transform:uppercase;
    letter-spacing:1.4px; color:var(--muted-dim); margin:0 0 16px;
    display:flex; align-items:center; gap:10px;
  }
  .section-label::after{ content:""; flex:1; height:1px; background:var(--hair); }

  /* ---------- Folder (groups linked structures) ---------- */
  .folder{
    border:1px dashed var(--hair);
    border-radius:18px;
    padding:22px;
    background:rgba(255,255,255,0.015);
    margin-bottom:18px;
  }
  .folder-head{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:14px; flex-wrap:wrap; margin-bottom:18px;
  }
  .folder-title-group{ display:flex; gap:12px; align-items:flex-start; }
  .folder-icon{
    width:38px; height:38px; flex:none;
    border:1.5px solid var(--copper); border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    color:var(--copper); background:var(--copper-dim);
    font-family:var(--font-mono); font-size:15px;
  }
  .folder-name{ font-family:var(--font-display); font-weight:600; font-size:17px; margin:0 0 3px; }
  .folder-sub{ font-family:var(--font-mono); font-size:11.5px; color:var(--muted); margin:0; }
  .folder-chip{
    font-family:var(--font-mono); font-size:11.5px; color:var(--muted);
    text-align:right; line-height:1.7; white-space:nowrap;
  }
  .folder-chip b{ color:var(--ink); font-weight:600; }
  .folder-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); gap:16px;
  }

  .yard{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:18px; }

  /* ---------- Card ---------- */
  .card{
    position:relative;
    background:var(--bg-card);
    border:1px solid var(--hair);
    border-radius:var(--radius);
    padding:20px 20px 18px;
    cursor:pointer;
    transition:transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    display:flex; flex-direction:column; gap:14px;
    text-align:left; width:100%; color:inherit; font-family:inherit;
  }
  .card:hover, .card:focus-visible{
    background:var(--bg-card-hover); border-color:var(--cyan-dim); transform:translateY(-2px);
  }
  .card::before{
    content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px;
    border-radius:0 3px 3px 0; background:var(--copper); opacity:0.85;
  }
  .card.is-empty::before{ background:var(--muted-dim); opacity:0.5; }

  .card-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  }
  .card-title{
    font-family:var(--font-display); font-size:16.5px; font-weight:600;
    margin:0; line-height:1.35; flex:1; min-width:0;
  }
  .card-sub{ font-family:var(--font-mono); font-size:11px; color:var(--muted); margin:-6px 0 0; }

  .stamp{
    flex:none;
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.8px; text-transform:uppercase;
    border:1px dashed currentColor; border-radius:999px; padding:4px 10px;
    transform:rotate(-4deg); white-space:nowrap; margin-top:1px;
  }
  .stamp.filed{ color:var(--cyan); }
  .stamp.empty{ color:var(--muted-dim); }

  .bars{ display:flex; flex-direction:column; gap:8px; }
  .bar-row{ display:grid; grid-template-columns:88px 1fr 46px; align-items:center; gap:8px; font-family:var(--font-mono); font-size:11px; color:var(--muted); }
  .bar-row .bname{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track{ height:6px; background:rgba(255,255,255,0.05); border-radius:4px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:4px; background:linear-gradient(90deg, var(--copper), var(--cyan)); }
  .bar-row .bval{ text-align:right; color:var(--muted-dim); }

  .card-empty-msg{ color:var(--muted-dim); font-size:13px; line-height:1.55; }
  .card-empty-msg b{ color:var(--muted); }

  .card-foot{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:auto; padding-top:12px; border-top:1px solid var(--hair);
  }
  .foot-stat{ font-family:var(--font-mono); font-size:11.5px; color:var(--muted); }
  .foot-stat b{ color:var(--ink); font-weight:600; }
  .foot-cta{
    font-family:var(--font-mono); font-size:11px; color:var(--cyan);
    text-transform:uppercase; letter-spacing:0.6px; display:flex; align-items:center; gap:6px;
  }
  .card.is-empty .foot-cta{ color:var(--muted-dim); }
  .foot-cta svg{ width:12px; height:12px; }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(5,9,14,0.72); backdrop-filter: blur(3px);
    display:none; align-items:center; justify-content:center; padding:26px; z-index:50;
  }
  .modal-overlay.open{ display:flex; }

  .modal{
    width:min(880px, 100%); height:min(700px, 92vh);
    background:var(--bg-panel); border:1px solid var(--hair); border-radius:18px;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,0.5);
  }

  .modal-header{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:22px 26px 16px; border-bottom:1px solid var(--hair); flex:none;
  }
  .modal-eyebrow{ font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted-dim); margin:0 0 6px; }
  .modal-header h2{ font-family:var(--font-display); font-size:21px; margin:0; }
  .close-btn{
    background:none; border:1px solid var(--hair); color:var(--muted);
    width:32px; height:32px; border-radius:8px; cursor:pointer; flex:none; font-size:14px; line-height:1;
  }
  .close-btn:hover{ color:var(--ink); border-color:var(--cyan-dim); }

  .modal-stats{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:1px;
    background:var(--hair); flex:none;
  }
  .modal-stats .stat-box{
    background:var(--bg-panel); border:none; border-radius:0; padding:14px 18px;
  }
  .stat-box .num{ font-family:var(--font-mono); font-size:19px; font-weight:600; }
  .stat-box .lbl{ font-size:10.5px; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:0.5px; }

  .modal-tabbar{
    display:flex; gap:8px; padding:14px 26px 0; flex:none;
  }
  .tabbtn{
    font-family:var(--font-mono); font-size:11.5px; text-transform:uppercase; letter-spacing:0.4px;
    background:none; border:1px solid var(--hair); color:var(--muted);
    padding:8px 14px; border-radius:999px; cursor:pointer;
  }
  .tabbtn:hover{ color:var(--ink); }
  .tabbtn.active{ color:var(--cyan); border-color:var(--cyan-dim); background:var(--cyan-dim); }

  .modal-content{ flex:1; overflow-y:auto; padding:18px 26px 30px; }

  .note-block{
    background:var(--bg-card); border:1px dashed var(--hair); border-radius:10px;
    padding:14px 16px; font-size:12.5px; color:var(--muted); line-height:1.6; margin-top:18px;
  }
  .note-block b{ color:var(--ink); }
  .note-block code{ font-family:var(--font-mono); background:rgba(255,255,255,0.06); padding:1px 5px; border-radius:4px; font-size:11.5px; color:var(--cyan); }

  /* Table */
  .table-toolbar{ display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .search-input{
    flex:1; min-width:160px; background:var(--bg-card); border:1px solid var(--hair);
    color:var(--ink); font-family:var(--font-mono); font-size:12.5px; padding:9px 12px; border-radius:8px;
  }
  .search-input::placeholder{ color:var(--muted-dim); }
  .export-btn{
    background:none; border:1px solid var(--hair); color:var(--muted);
    font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.5px;
    padding:9px 14px; border-radius:8px; cursor:pointer; white-space:nowrap;
  }
  .export-btn:hover{ color:var(--cyan); border-color:var(--cyan-dim); }

  .table-wrap{ border:1px solid var(--hair); border-radius:10px; overflow:hidden; }
  table{ width:100%; border-collapse:collapse; font-family:var(--font-mono); font-size:12.5px; }
  thead th{
    text-align:left; background:var(--bg-card); color:var(--muted); font-weight:500;
    padding:10px 14px; border-bottom:1px solid var(--hair); cursor:pointer; user-select:none; white-space:nowrap;
  }
  thead th.num, td.cell-num{ text-align:right; }
  thead th:hover{ color:var(--ink); }
  thead th .arrow{ opacity:0.5; margin-left:4px; font-size:10px; }
  tbody td{ padding:8px 14px; border-bottom:1px solid rgba(255,255,255,0.035); color:var(--ink); }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:rgba(255,255,255,0.025); }
  td.cell-item{ color:var(--ink); }
  td.miss{ color:var(--copper); }
  td.avail{ color:var(--green); }
  .empty-row td{ text-align:center; color:var(--muted-dim); padding:26px; }

  .foot-total-row{
    display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:12px; color:var(--muted);
    padding:10px 14px; background:var(--bg-card); border:1px solid var(--hair); border-top:none;
    border-radius:0 0 10px 10px; margin-top:-10px;
  }
  .foot-total-row b{ color:var(--ink); }

  @media (max-width:720px){
    .page{ padding:22px 14px 60px; }
    .topbar{ align-items:flex-start; }
    .ledger-stats{ width:100%; justify-content:space-between; }
    .ledger-stat{ padding:0 10px; text-align:left; }
    .modal-overlay{ padding:0; }
    .modal{ width:100%; height:100%; border-radius:0; }
    .modal-stats{ grid-template-columns:repeat(2, 1fr); }
    .folder-chip{ text-align:left; }
  }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>

</div>

<div class="modal-overlay" id="modalOverlay">

    <div class="modal-tabbar" id="modalTabbar"></div>
    <div class="modal-content" id="modalContent"></div>

</div>

          {item:"White Stained Glass Pane", label:"1 SB", extra:0},
          {item:"Bedrock", label:"1 SB", extra:0},
          {item:"Obsidian", label:"1 SB", extra:0},
        ],
        shulkerBoxCount: 96,
      },
    ],
    combinedTotal: 207942,
    combinedShulkerBoxes: 121,
  },
];

const EMPTY_SLOTS = [
  { hint: "Next schematic export" },
  { hint: "Next schematic export" },
];

/* ========================================================================= */

const fmt = n => n.toLocaleString("en-US");

function sumMaterials(materials, key){ return materials.reduce((s,r)=>s+r[key],0); }

function structureStats(structure){
  const total = sumMaterials(structure.materials, "total");
  const available = sumMaterials(structure.materials, "available");
  const pct = total ? Math.round((available/total)*1000)/10 : 0;
  return { total, available, pct };
}

function projectStats(project){
  const allMats = project.structures.flatMap(s=>s.materials);
  const total = sumMaterials(allMats,"total");
  const available = sumMaterials(allMats,"available");
  const pct = total ? Math.round((available/total)*1000)/10 : 0;
  return { total, available, pct, itemTypes: allMats.length };
}

/* ---------- Ledger header stats ---------- */

function renderLedgerStats(){
  const el = document.getElementById("ledgerStats");
  const filed = PROJECTS.reduce((n,p)=>n+p.structures.length,0);
  const reserved = EMPTY_SLOTS.length;
  let grandTotal = 0, grandAvail = 0, grandTypes = 0;
  PROJECTS.forEach(p=>{
    const t = projectStats(p);
    grandTotal += t.total; grandAvail += t.available; grandTypes += t.itemTypes;
  });
  const pct = grandTotal ? Math.round((grandAvail/grandTotal)*1000)/10 : 0;

  el.innerHTML = `
    <div class="ledger-stat"><span class="num">${filed}</span><span class="lbl">Filed</span></div>
    <div class="ledger-stat"><span class="num">${reserved}</span><span class="lbl">Reserved</span></div>
    <div class="ledger-stat"><span class="num">${fmt(grandTypes)}</span><span class="lbl">Block types</span></div>
    <div class="ledger-stat"><span class="num">${fmt(grandTotal)}</span><span class="lbl">Blocks needed</span></div>
    <div class="ledger-stat"><span class="num">${pct}%</span><span class="lbl">Gathered</span></div>
  `;
}

/* ---------- Folders + structure cards ---------- */

function renderFolders(){
  const root = document.getElementById("folders");
  root.innerHTML = "";

  PROJECTS.forEach(project=>{
    const pt = projectStats(project);
    const folder = document.createElement("section");
    folder.className = "folder";
    folder.innerHTML = `
      <div class="folder-head">
        <div class="folder-title-group">
          <div class="folder-icon">▣</div>
          <div>
            <p class="folder-name">${project.name}</p>
            <p class="folder-sub">${project.structures.length} structures filed together</p>
          </div>
        </div>
        <div class="folder-chip"><b>${fmt(pt.total)}</b> blocks combined<br>${pt.pct}% gathered</div>
      </div>
      <div class="folder-grid"></div>
    `;
    const grid = folder.querySelector(".folder-grid");

    project.structures.forEach(structure=>{
      const st = structureStats(structure);
      const top3 = [...structure.materials].sort((a,b)=>b.total-a.total).slice(0,3);
      const max = top3.length ? top3[0].total : 1;

      const card = document.createElement("button");
      card.className = "card";
      card.innerHTML = `
        <div class="card-head">
          <h3 class="card-title">${structure.name}</h3>
          <span class="stamp filed">${st.pct}%</span>
        </div>
        <p class="card-sub">${structure.materials.length} block types</p>
        <div class="bars">
          ${top3.map(m=>`
            <div class="bar-row">
              <span class="bname" title="${m.item}">${m.item}</span>
              <span class="bar-track"><span class="bar-fill" style="width:${Math.round((m.total/max)*100)}%"></span></span>
              <span class="bval">${fmt(m.total)}</span>
            </div>
          `).join("")}
        </div>
        <div class="card-foot">
          <span class="foot-stat">Needs <b>${fmt(structure.totalBlocks)}</b> blocks</span>
          <span class="foot-cta">Open manifest
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </span>
        </div>
      `;
      card.addEventListener("click", ()=>openStructureModal(project, structure));
      grid.appendChild(card);
    });

    root.appendChild(folder);
  });
}

function renderEmptySlots(){
  const emptyEl = document.getElementById("yardEmpty");
  emptyEl.innerHTML = "";
  EMPTY_SLOTS.forEach((slot, i)=>{
    const card = document.createElement("div");
    card.className = "card is-empty";
    card.innerHTML = `
      <div class="card-head">
        <h3 class="card-title">Untitled manifest</h3>
        <span class="stamp empty">0 items</span>
      </div>
      <p class="card-sub">Slot ${i+1} · no schematic filed</p>
      <p class="card-empty-msg">${slot.hint || "Waiting on a material list."} Export a list from your world editor and add it to <b>PROJECTS</b> in the page source to fill this slot.</p>
      <div class="card-foot">
        <span class="foot-stat">Needs <b>0</b> blocks</span>
        <span class="foot-cta">Reserved</span>
      </div>
    `;
    emptyEl.appendChild(card);
  });
}

/* ---------- Modal (scoped to one structure at a time) ---------- */

const overlay = document.getElementById("modalOverlay");
const modalTitleEl = document.getElementById("modalTitle");
const modalEyebrowEl = document.getElementById("modalEyebrow");
const modalStatsEl = document.getElementById("modalStats");
const modalTabbarEl = document.getElementById("modalTabbar");
const modalContentEl = document.getElementById("modalContent");

let currentProject = null;
let currentStructure = null;
let currentTab = "materials";
const sortState = {};
const searchState = {};

function openStructureModal(project, structure){
  currentProject = project;
  currentStructure = structure;
  currentTab = "materials";
  modalEyebrowEl.textContent = project.name;
  modalTitleEl.textContent = structure.name;
  renderModalStats();
  renderTabbar();
  renderTabContent();
  overlay.classList.add("open");
}

function closeModal(){ overlay.classList.remove("open"); }
document.getElementById("closeModal").addEventListener("click", closeModal);
overlay.addEventListener("click", e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

function renderModalStats(){
  const st = structureStats(currentStructure);
  modalStatsEl.innerHTML = `
    <div class="stat-box"><div class="num">${fmt(currentStructure.totalBlocks)}</div><div class="lbl">Blocks needed</div></div>
    <div class="stat-box"><div class="num">${fmt(currentStructure.materials.length)}</div><div class="lbl">Block types</div></div>
    <div class="stat-box"><div class="num">${fmt(currentStructure.shulkerBoxCount)}</div><div class="lbl">Full shulker boxes</div></div>
    <div class="stat-box"><div class="num">${st.pct}%</div><div class="lbl">Gathered</div></div>
  `;
}

function renderTabbar(){
  const tabs = [
    { id:"materials", label:"Materials list" },
    { id:"shulkers", label:"Shulker packing" },
  ];
  modalTabbarEl.innerHTML = tabs.map(t=>`<button class="tabbtn ${t.id===currentTab?"active":""}" data-tab="${t.id}">${t.label}</button>`).join("");
  modalTabbarEl.querySelectorAll(".tabbtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      currentTab = btn.dataset.tab;
      renderTabbar();
      renderTabContent();
    });
  });
}

function renderTabContent(){
  if(currentTab === "materials") renderStructureTable(currentStructure);
  else renderShulkerTable(currentStructure);
}

function renderShulkerTable(structure){
  modalContentEl.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Item</th><th class="num">Shulkers + extra</th><th class="num">Loose extra</th></tr></thead>
        <tbody>
          ${structure.shulkers.map(r=>`
            <tr><td class="cell-item">${r.item}</td><td class="cell-num">${r.label}</td><td class="cell-num">${fmt(r.extra)}</td></tr>
          `).join("")}
        </tbody>
      </table>
    </div>
    <div class="foot-total-row">
      <span>${structure.name}</span>
      <span><b>${fmt(structure.totalBlocks)}</b> blocks · <b>${fmt(structure.shulkerBoxCount)}</b> full shulker boxes</span>
    </div>
    <div class="note-block">
      This structure is filed together with <b>${currentProject.structures.length - 1}</b> other structure${currentProject.structures.length>2?"s":""}
      under <b>${currentProject.name}</b> — combined the folder needs <b>${fmt(currentProject.combinedTotal)}</b> blocks and
      <b>${fmt(currentProject.combinedShulkerBoxes)}</b> full shulker boxes.
    </div>
  `;
}

function renderStructureTable(structure){
  if(!sortState[structure.id]) sortState[structure.id] = { key:null, dir:"desc" };
  if(searchState[structure.id]===undefined) searchState[structure.id] = "";

  modalContentEl.innerHTML = `
    <div class="table-toolbar">
      <input type="text" class="search-input" id="searchBox" placeholder="Filter by item name…" value="${searchState[structure.id]}">
      <button class="export-btn" id="exportBtn">Export CSV</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-key="item">Item <span class="arrow"></span></th>
            <th class="num" data-key="total">Total <span class="arrow"></span></th>
            <th class="num" data-key="missing">Missing <span class="arrow"></span></th>
            <th class="num" data-key="available">Available <span class="arrow"></span></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="foot-total-row">
      <span>${structure.name}</span>
      <span id="visibleCount"></span>
    </div>
  `;

  paintHeaderArrows(structure);
  paintTableBody(structure);

  document.getElementById("searchBox").addEventListener("input", e=>{
    searchState[structure.id] = e.target.value;
    paintTableBody(structure);
  });

  modalContentEl.querySelectorAll("thead th").forEach(th=>{
    th.addEventListener("click", ()=>{
      const key = th.dataset.key;
      const s = sortState[structure.id];
      if(s.key === key){ s.dir = s.dir==="asc" ? "desc" : "asc"; }
      else { s.key = key; s.dir = key==="item" ? "asc" : "desc"; }
      paintHeaderArrows(structure);
      paintTableBody(structure);
    });
  });

  document.getElementById("exportBtn").addEventListener("click", ()=>exportCSV(structure));
}

function paintHeaderArrows(structure){
  const s = sortState[structure.id];
  modalContentEl.querySelectorAll("thead th").forEach(th=>{
    const arrow = th.querySelector(".arrow");
    arrow.textContent = th.dataset.key === s.key ? (s.dir === "asc" ? "▲" : "▼") : "";
  });
}

function paintTableBody(structure){
  const s = sortState[structure.id];
  const query = searchState[structure.id].trim().toLowerCase();
  let rows = structure.materials.filter(r=>r.item.toLowerCase().includes(query));

  if(s.key){
    rows = [...rows].sort((a,b)=>{
      let av=a[s.key], bv=b[s.key];
      if(typeof av === "string"){ av = av.toLowerCase(); bv = bv.toLowerCase(); }
      if(av<bv) return s.dir==="asc" ? -1 : 1;
      if(av>bv) return s.dir==="asc" ? 1 : -1;
      return 0;
    });
  }

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = rows.length === 0
    ? `<tr class="empty-row"><td colspan="4">No item matches “${searchState[structure.id]}”.</td></tr>`
    : rows.map(r=>`
        <tr>
          <td class="cell-item">${r.item}</td>
          <td class="cell-num">${fmt(r.total)}</td>
          <td class="cell-num miss">${fmt(r.missing)}</td>
          <td class="cell-num avail">${fmt(r.available)}</td>
        </tr>
      `).join("");

  document.getElementById("visibleCount").textContent = `Showing ${rows.length} of ${structure.materials.length} block types`;
}

function exportCSV(structure){
  const header = "Item,Total,Missing,Available\n";
  const body = structure.materials.map(r=>`"${r.item}",${r.total},${r.missing},${r.available}`).join("\n");
  const blob = new Blob([header+body], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${structure.name.replace(/[^a-z0-9]+/gi,"-").toLowerCase()}-manifest.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* ---------- Init ---------- */
renderLedgerStats();
renderFolders();
renderEmptySlots();
</script>
</body>
</html>
